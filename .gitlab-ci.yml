# All github-workflows refs pinned to the merge SHA of !31 (v0.0.48 — adds
# TAG_OVERRIDE + TOX_BASE_IMAGE). Renovate will bump these on subsequent
# template releases.
include:
  - project: 'tnoff-projects/github-workflows'
    ref: 3dc971c41a156e3e17ce1824fb27c5b731b17433
    file: '/gitlab/tag.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 3dc971c41a156e3e17ce1824fb27c5b731b17433
    file: '/gitlab/buildkit-docker-push.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 3dc971c41a156e3e17ce1824fb27c5b731b17433
    file: '/gitlab/renovate.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 3dc971c41a156e3e17ce1824fb27c5b731b17433
    file: '/gitlab/bump-version.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 3dc971c41a156e3e17ce1824fb27c5b731b17433
    file: '/gitlab/trufflehog.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 3dc971c41a156e3e17ce1824fb27c5b731b17433
    file: '/gitlab/discord-notify.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 3dc971c41a156e3e17ce1824fb27c5b731b17433
    file: '/gitlab/trigger-bump.yml'

default:
  tags:
    - self-hosted

stages:
  - validate
  - build
  - tag
  - notify
  - renovate

# Renovate-driven minor bump on MRs branched from /^renovate\/dev-/.
bump-version:
  extends: .bump-version
  variables:
    GITLAB_PUSH_TOKEN: $RENOVATE_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\/dev-/

trufflehog:
  extends: .trufflehog
  stage: validate
  rules:
    # Fork MRs require a project member to manually trigger jobs — prevents untrusted code from running CI automatically
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Guard rail: the matrix in `build:` below must stay in sync with the
# env_list in tox.ini. tox.ini is the documented "what Python minors do
# we publish" declaration; the matrix is the operational one. This job
# fails the pipeline if they drift.
matrix-sync-check:
  stage: validate
  image: docker.io/library/python:3.14-slim
  before_script:
    - pip install tox pyyaml
  script:
    - |
      python3 - <<'PYEOF'
      import re, subprocess, yaml

      # GitLab's !reference tag isn't a standard YAML construct, so PyYAML's
      # SafeLoader refuses to parse it. We only need build.parallel.matrix,
      # which contains no !reference, so treat the tag as opaque.
      class GLLoader(yaml.SafeLoader):
          pass
      GLLoader.add_constructor('!reference', lambda loader, node: None)

      result = subprocess.run(['tox', '-l'], capture_output=True, text=True, check=True)
      tox_versions = set()
      for env in result.stdout.strip().splitlines():
          m = re.fullmatch(r'py(\d)(\d+)', env)
          if m:
              tox_versions.add(f'{m.group(1)}.{m.group(2)}')

      with open('.gitlab-ci.yml') as f:
          ci = yaml.load(f, Loader=GLLoader)
      matrix_versions = set(ci['build']['parallel']['matrix'][0]['PYTHON_VERSION'])

      if tox_versions != matrix_versions:
          raise SystemExit(
              f'tox.ini and .gitlab-ci.yml matrix have drifted.\n'
              f'  tox.ini env_list:    {sorted(tox_versions)}\n'
              f'  build matrix:        {sorted(matrix_versions)}\n'
              f'Update both when adding/removing a Python minor.'
          )
      print(f'Matrix in sync: {sorted(tox_versions)}')
      PYEOF
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# One :3.X mutable + :3.X-<short-sha> immutable tag per Python minor.
# Add a new minor here AND in tox.ini together — matrix-sync-check enforces.
build:
  extends: .buildkit-docker-push
  stage: build
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
  variables:
    DOCKERFILE_DIR: python
    BUILD_ARGS: '--opt build-arg:PYTHON_VERSION=$PYTHON_VERSION'
    TAG_OVERRIDE: '$PYTHON_VERSION'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# Single-tag images (:latest + :<sha>) for non-Python CI tooling.
# OCI_USERNAME_64 / OCI_TOKEN_64 are the same ci-base-images push user
# (its IAM policy covers all ci-* repos).
#
# OCI_REPO_NAME_64 is exported in before_script from the per-image var
# rather than set as `OCI_REPO_NAME_64: $OCI_X_REPO_NAME_64` at the YAML
# level, because GitLab does not reliably substitute when both sides are
# masked CI variables — the override silently no-ops and OCI_REPO_NAME_64
# falls back to the project default (ci-base-images), so the image would
# get pushed to iad.ocir.io/tnoff/ci-base-images:latest, clobbering it.
# Shell expansion of the masked var at runtime always works. See
# discord-bot/.gitlab-ci.yml's docker-push-dispatcher for the same pattern.
build-spellcheck:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: spellcheck
  before_script:
    - export OCI_REPO_NAME_64="$OCI_SPELLCHECK_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

build-rust-tauri:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: rust-tauri
  before_script:
    - export OCI_REPO_NAME_64="$OCI_RUST_TAURI_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

build-k8s-lint:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: k8s-lint
  before_script:
    - export OCI_REPO_NAME_64="$OCI_K8S_LINT_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

tag-build:
  extends: .tag
  stage: tag
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# Fire the shared docker-apps pipeline trigger after every successful build
# so docker-apps' cleanup-ci-base-images job spawns a one-off Job that
# prunes old :3.X-<sha> tags from OCIR. Doesn't pin any docker-apps
# manifest — this repo's image isn't referenced by any K8s workload.
# IMAGE is set inline (the .trigger-bump template's err-check requires
# it); CI_BASE_IMAGE_PATH is the plaintext group variable provisioned
# in terraform/infra/gitlab.tf.
trigger-cleanup:
  extends: .trigger-bump
  stage: tag
  needs: [build]
  variables:
    BUMP_SOURCE: 'ci-base-images'
    IMAGE: '$CI_BASE_IMAGE_PATH'

# Single-tag siblings of trigger-cleanup. Each one fires after its own
# build-* succeeds (independent needs so a failed rust-tauri build doesn't
# block the spellcheck cleanup). BUMP_SOURCE values match docker-apps'
# cleanup-ci-* jobs and the cleanup-ci-<image> suspended CronJob templates.
# IMAGE is hardcoded — docker-apps' cleanup-* jobs only consume BUMP_SOURCE
# and IMAGE_TAG (the git short SHA), but the .trigger-bump template's
# err-check requires IMAGE to be non-empty.
trigger-cleanup-spellcheck:
  extends: .trigger-bump
  stage: tag
  needs: [build-spellcheck]
  variables:
    BUMP_SOURCE: 'ci-spellcheck'
    IMAGE: 'iad.ocir.io/tnoff/ci-spellcheck'

trigger-cleanup-rust-tauri:
  extends: .trigger-bump
  stage: tag
  needs: [build-rust-tauri]
  variables:
    BUMP_SOURCE: 'ci-rust-tauri'
    IMAGE: 'iad.ocir.io/tnoff/ci-rust-tauri'

trigger-cleanup-k8s-lint:
  extends: .trigger-bump
  stage: tag
  needs: [build-k8s-lint]
  variables:
    BUMP_SOURCE: 'ci-k8s-lint'
    IMAGE: 'iad.ocir.io/tnoff/ci-k8s-lint'

notify-failure:
  extends: .discord-notify
  stage: notify
  needs: [build, build-spellcheck, build-rust-tauri, build-k8s-lint, tag-build]
  variables:
    NOTIFY_TYPE: failure
    DISCORD_WEBHOOK_URL: $DISCORD_BUILD_FAILURE_WEBHOOK
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_failure

notify-renovate-failure:
  extends: .discord-notify
  stage: renovate
  needs: [renovate]
  variables:
    NOTIFY_TYPE: failure
    DISCORD_WEBHOOK_URL: $DISCORD_BUILD_FAILURE_WEBHOOK
    NOTIFY_MESSAGE: 'Renovate failed'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure

renovate:
  extends: .renovate
  stage: renovate
  variables:
    GITHUB_COM_TOKEN: $GITHUB_BOT_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
