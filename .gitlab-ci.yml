# One :3.X mutable + :3.X-<short-sha> immutable tag per Python minor.
# Add a new minor here AND in tox.ini together — matrix-sync-check enforces.
build:
  extends: .buildkit-docker-push
  stage: build
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
  variables:
    DOCKERFILE_DIR: python
    BUILD_ARGS: '--opt build-arg:PYTHON_VERSION=$PYTHON_VERSION'
    TAG_OVERRIDE: '$PYTHON_VERSION'
    # Shared across the 4 minors (matches build-check-python) so MR build-check
    # and main push reuse the same S3 cache namespace, separate from the
    # single-tag images below.
    CACHE_NAME: ci-base-images-python
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# Single-tag images (:latest + :<sha>) for non-Python CI tooling.
# OCI_USERNAME_64 / OCI_TOKEN_64 are the same ci-base-images push user
# (its IAM policy covers all ci-* repos).
#
# OCI_REPO_NAME_64 is exported in before_script from the per-image var
# rather than set as `OCI_REPO_NAME_64: $OCI_X_REPO_NAME_64` at the YAML
# level, because GitLab does not reliably substitute when both sides are
# masked CI variables — the override silently no-ops and OCI_REPO_NAME_64
# falls back to the project default (ci-base-images), so the image would
# get pushed to iad.ocir.io/tnoff/ci-base-images:latest, clobbering it.
# Shell expansion of the masked var at runtime always works. See
# discord-bot/.gitlab-ci.yml's docker-push-dispatcher for the same pattern.
build-spellcheck:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: spellcheck
    CACHE_NAME: ci-base-images-spellcheck
  before_script:
    - export OCI_REPO_NAME_64="$OCI_SPELLCHECK_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

build-rust-tauri:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: rust-tauri
    CACHE_NAME: ci-base-images-rust-tauri
  before_script:
    - export OCI_REPO_NAME_64="$OCI_RUST_TAURI_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

build-k8s-lint:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: k8s-lint
    CACHE_NAME: ci-base-images-k8s-lint
  before_script:
    - export OCI_REPO_NAME_64="$OCI_K8S_LINT_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

build-alpine-utils:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: alpine-utils
    CACHE_NAME: ci-base-images-alpine-utils
  before_script:
    - export OCI_REPO_NAME_64="$OCI_ALPINE_UTILS_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

build-pre-commit:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: pre-commit
    CACHE_NAME: ci-base-images-pre-commit
  before_script:
    - export OCI_REPO_NAME_64="$OCI_PRE_COMMIT_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

build-terragrunt-utils:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: terragrunt-utils
    CACHE_NAME: ci-base-images-terragrunt-utils
  before_script:
    - export OCI_REPO_NAME_64="$OCI_TERRAGRUNT_UTILS_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

build-trufflehog:
  extends: .buildkit-docker-push
  stage: build
  variables:
    DOCKERFILE_DIR: trufflehog
    CACHE_NAME: ci-base-images-trufflehog
  before_script:
    - export OCI_REPO_NAME_64="$OCI_TRUFFLEHOG_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

tag-build:
  extends: .tag
  stage: tag
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# Fire the shared docker-apps pipeline trigger after every successful build
# so docker-apps' cleanup-ci-base-images job spawns a one-off Job that
# prunes old :3.X-<sha> tags from OCIR. Doesn't pin any docker-apps
# manifest — this repo's image isn't referenced by any K8s workload.
# IMAGE is set inline (the .trigger-bump template's err-check requires
# it); CI_BASE_IMAGE_PATH is the plaintext group variable provisioned
# in terraform/infra/gitlab.tf.
trigger-cleanup:
  extends: .trigger-bump
  stage: tag
  needs: [build]
  variables:
    BUMP_SOURCE: 'ci-base-images'
    IMAGE: '$CI_BASE_IMAGE_PATH'

# Single-tag siblings of trigger-cleanup. Each one fires after its own
# build-* succeeds (independent needs so a failed rust-tauri build doesn't
# block the spellcheck cleanup). BUMP_SOURCE values match docker-apps'
# cleanup-ci-* jobs and the cleanup-ci-<image> suspended CronJob templates.
# IMAGE is hardcoded — docker-apps' cleanup-* jobs only consume BUMP_SOURCE
# and IMAGE_TAG (the git short SHA), but the .trigger-bump template's
# err-check requires IMAGE to be non-empty.
trigger-cleanup-spellcheck:
  extends: .trigger-bump
  stage: tag
  needs: [build-spellcheck]
  variables:
    BUMP_SOURCE: 'ci-spellcheck'
    IMAGE: 'iad.ocir.io/tnoff/ci-spellcheck'

trigger-cleanup-rust-tauri:
  extends: .trigger-bump
  stage: tag
  needs: [build-rust-tauri]
  variables:
    BUMP_SOURCE: 'ci-rust-tauri'
    IMAGE: 'iad.ocir.io/tnoff/ci-rust-tauri'

trigger-cleanup-k8s-lint:
  extends: .trigger-bump
  stage: tag
  needs: [build-k8s-lint]
  variables:
    BUMP_SOURCE: 'ci-k8s-lint'
    IMAGE: 'iad.ocir.io/tnoff/ci-k8s-lint'

trigger-cleanup-alpine-utils:
  extends: .trigger-bump
  stage: tag
  needs: [build-alpine-utils]
  variables:
    BUMP_SOURCE: 'ci-alpine-utils'
    IMAGE: 'iad.ocir.io/tnoff/ci-alpine-utils'

trigger-cleanup-pre-commit:
  extends: .trigger-bump
  stage: tag
  needs: [build-pre-commit]
  variables:
    BUMP_SOURCE: 'ci-pre-commit'
    IMAGE: 'iad.ocir.io/tnoff/ci-pre-commit'

trigger-cleanup-terragrunt-utils:
  extends: .trigger-bump
  stage: tag
  needs: [build-terragrunt-utils]
  variables:
    BUMP_SOURCE: 'ci-terragrunt-utils'
    IMAGE: 'iad.ocir.io/tnoff/ci-terragrunt-utils'

trigger-cleanup-trufflehog:
  extends: .trigger-bump
  stage: tag
  needs: [build-trufflehog]
  variables:
    BUMP_SOURCE: 'ci-trufflehog'
    IMAGE: 'iad.ocir.io/tnoff/ci-trufflehog'

notify-failure:
  extends: .discord-notify
  stage: notify
  needs: [build, build-spellcheck, build-rust-tauri, build-k8s-lint, build-alpine-utils, build-pre-commit, build-terragrunt-utils, build-trufflehog, tag-build]
  variables:
    NOTIFY_TYPE: failure
    DISCORD_WEBHOOK_URL: $DISCORD_BUILD_FAILURE_WEBHOOK
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_failure

notify-renovate-failure:
  extends: .discord-notify
  stage: renovate
  needs: [renovate]
  variables:
    NOTIFY_TYPE: failure
    DISCORD_WEBHOOK_URL: $DISCORD_BUILD_FAILURE_WEBHOOK
    NOTIFY_MESSAGE: 'Renovate failed'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure

renovate:
  extends: .renovate
  stage: renovate
  variables:
    GITHUB_COM_TOKEN: $GITHUB_BOT_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Scheduled prune of stale automation branches (bump/* + renovate/*) left
# behind because remove_source_branch only fires on MR merge, not on the
# API-driven close of a superseded bump/renovate MR. Rides the weekly
# schedule and reuses RENOVATE_TOKEN. See the github-workflows
# .branch-cleanup template and docs runbooks/branch-cleanup.md.
branch-cleanup:
  extends: .branch-cleanup
  stage: renovate
  variables:
    CLEANUP_AGE_DAYS: "30"
    DRY_RUN: "false"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

notify-cleanup-failure:
  extends: .discord-notify
  stage: renovate
  needs: [branch-cleanup]
  variables:
    NOTIFY_TYPE: failure
    DISCORD_WEBHOOK_URL: $DISCORD_BUILD_FAILURE_WEBHOOK
    NOTIFY_MESSAGE: 'Branch cleanup failed'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure
