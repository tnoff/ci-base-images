# All github-workflows refs pinned to the merge SHA of !64 (v0.0.49 —
# recompute-on-rebase in bump-version, so a 2nd renovate/CI MR in an ff run
# self-heals its VERSION bump instead of conflicting). Renovate will bump
# these on subsequent template releases.
include:
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/tag.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/buildkit-docker-push.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/renovate.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/branch-cleanup.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/bump-version.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/trufflehog.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/discord-notify.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/trigger-bump.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/buildkit-build-check.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: 76247ad77bbbffcebadefe3d6b7ea49034752d17
    file: '/gitlab/trufflehog-image.yml'

default:
  tags:
    - self-hosted

stages:
  - validate
  - build
  - tag
  - notify
  - renovate

# Renovate-driven patch bump on every /^renovate\// MR. Unlike the Python
# repos, this repo doesn't extend the github-workflows renovate/python preset
# that adds the dev-/test- branch prefixes, so all of its bumps — base images
# (dockerfile), the baked tool-version ARGs + github-workflows include digest
# (custom.regex) — land on unprefixed renovate/ branches. Gating on the whole
# namespace (not just renovate/dev-) means each dependency bump cuts its own
# VERSION patch and gets its own v<VERSION> tag on merge.
bump-version:
  extends: .bump-version
  variables:
    GITLAB_PUSH_TOKEN: $RENOVATE_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//

trufflehog:
  extends: .trufflehog
  stage: validate
  rules:
    # Fork MRs require a project member to manually trigger jobs — prevents untrusted code from running CI automatically
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Guard rail: the matrix in `build:` below must stay in sync with the
# env_list in tox.ini. tox.ini is the documented "what Python minors do
# we publish" declaration; the matrix is the operational one. This job
# fails the pipeline if they drift.
matrix-sync-check:
  stage: validate
  image: docker.io/library/python:3.14-slim
  before_script:
    - pip install tox pyyaml
  script:
    - |
      python3 - <<'PYEOF'
      import re, subprocess, yaml

      # GitLab's !reference tag isn't a standard YAML construct, so PyYAML's
      # SafeLoader refuses to parse it. We only need build.parallel.matrix,
      # which contains no !reference, so treat the tag as opaque.
      class GLLoader(yaml.SafeLoader):
          pass
      GLLoader.add_constructor('!reference', lambda loader, node: None)

      result = subprocess.run(['tox', '-l'], capture_output=True, text=True, check=True)
      tox_versions = set()
      for env in result.stdout.strip().splitlines():
          m = re.fullmatch(r'py(\d)(\d+)', env)
          if m:
              tox_versions.add(f'{m.group(1)}.{m.group(2)}')

      with open('.gitlab-ci.yml') as f:
          ci = yaml.load(f, Loader=GLLoader)
      matrix_versions = set(ci['build']['parallel']['matrix'][0]['PYTHON_VERSION'])

      if tox_versions != matrix_versions:
          raise SystemExit(
              f'tox.ini and .gitlab-ci.yml matrix have drifted.\n'
              f'  tox.ini env_list:    {sorted(tox_versions)}\n'
              f'  build matrix:        {sorted(matrix_versions)}\n'
              f'Update both when adding/removing a Python minor.'
          )
      print(f'Matrix in sync: {sorted(tox_versions)}')
      PYEOF
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# MR-time image validation. The push-side build-* jobs above only run on
# main, so without these an MR that edits a Dockerfile merges unbuilt — a
# broken apt/apk line surfaces only post-merge via notify-failure. Each
# build-check-* compiles its image with buildkit (no push, no creds) and
# emits a docker-save tarball; the paired trufflehog-image-* scans that
# tarball for secrets baked into a layer.
#
# Gated on `changes:` to each image's own dir, so a Dockerfile edit builds +
# scans only the image it touches (Dockerfile edits are rare — Renovate base
# bumps + manual dep changes — so the extra load on the concurrent:2 ci pool
# is bounded). The push side handles main; these are MR-only.
#
# python: the apt layer is identical Debian-bookworm across all four minors
# (only the PYTHON_VERSION build-arg base image differs), so one build-check
# on the default minor validates the Dockerfile for the whole 3.11–3.14
# matrix that build: publishes.
build-check-python:
  extends: .buildkit-build-check
  stage: validate
  variables:
    DOCKERFILE_DIR: python
    OUTPUT_NAME: ci-base-images-python:ci
    OUTPUT_TARBALL: python.tar
    CACHE_NAME: ci-base-images-python
  rules: &python-image-rules
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - python/**/*

trufflehog-image-python:
  extends: .trufflehog-image
  stage: validate
  needs:
    - job: build-check-python
      artifacts: true
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: python.tar
  rules: *python-image-rules

